<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You for Your Purchase</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 480px; margin: 20px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #eee; padding: 24px; }
    .logo { text-align: center; margin-bottom: 16px; }
    .logo img { max-width: 120px; }
    .course-img { width: 100%; max-width: 320px; border-radius: 6px; margin: 16px auto; display: block; }
    .btn { display: inline-block; background: #007bff; color: #fff !important; padding: 12px 28px; border-radius: 4px; text-decoration: none; font-weight: bold; margin: 20px 0; }
    .footer { font-size: 13px; color: #888; text-align: center; margin-top: 24px; }
    @media (max-width: 600px) { .container { padding: 10px; } .btn { width: 100%; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="{{logo_url}}" alt="AK23 Studio Kits Logo">
    </div>
    <h2 style="text-align:center;">Thank you for your purchase!</h2>
    <h3 style="text-align:center;">{{course_name}}</h3>
    <img src="{{course_img}}" alt="course Image" class="course-img">
    <p style="text-align:center;">Your secure download is ready. This link is valid for 24 hours and up to 3 downloads.</p>
    <div style="text-align:center;">
      <a href="{{download_link}}" class="btn">Download Now</a>
    </div>
    <div class="footer">
      Need help? Contact <a href="mailto:{{support_email}}">{{support_email}}</a><br>
      &copy; AK23 Studio Kits
    </div>
  </div>
</body>
</html>
